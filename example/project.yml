# Xcode project, generated by XcodeGen rather than checked in.
#
# A committed `.xcodeproj` is a binary-ish blob that conflicts on every merge and hides what it
# configures. This file is the configuration; run `xcodegen generate` in this folder to produce the
# project, then open `WirexMobileSdkExample.xcodeproj`.
#
#   brew install xcodegen
#   xcodegen generate
#
name: WirexMobileSdkExample

options:
  bundleIdPrefix: com.wirexapp.baas
  deploymentTarget:
    # The SDK's floor.
    iOS: "13.0"
  createIntermediateGroups: true

packages:
  # The published SDK. `import WirexMobileSDK` gives all four surfaces — card reveal, card collect,
  # 3-D Secure and wallet top-up — from one binary package.
  WirexMobileSDK:
    url: https://github.com/wirexpay/baas-mobile-ios-sdk.git
    from: "0.3.7"

targets:
  WirexMobileSdkExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: WirexMobileSDK
        product: WirexMobileSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wirexapp.baas.example.ios
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
